{% extends "base.html" %}
{% block title %}Creare Setare{% endblock %}
{% block content %}
<h2 class="text-secondary mb-4">Definire Setare Nouă</h2>
<form action="/setari/creare" method="POST" class="card shadow-sm p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Numele Setării (ex: COMISION_PROCENT) *</label>
        <input type="text" name="nume_setare" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Valoarea Setării *</label>
        <input type="text" name="valoare_setare" class="form-control" required>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-secondary">Salvează Setarea</button>
        <a href="/setari" class="btn btn-outline-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
