{% extends "base.html" %}
{% block title %}Creare Categorie{% endblock %}
{% block content %}
<h2 class="text-success mb-4">Adăugare Categorie Nouă</h2>
<form action="/categorii/creare" method="POST" class="card shadow-sm p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Categorie *</label>
        <input type="text" name="nume" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Descriere</label>
        <textarea name="descriere" class="form-control" rows="3"></textarea>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-success">Salvează</button>
        <a href="/categorii" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
