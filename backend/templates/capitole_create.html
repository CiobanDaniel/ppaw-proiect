{% extends "base.html" %}
{% block title %}Creare Capitol{% endblock %}
{% block content %}
<h2 class="text-success mb-4">Scrie Capitol Nou</h2>
<form action="/capitole/creare" method="POST" class="card shadow-sm p-4">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Selectează Cartea *</label>
            <select name="id_carte" class="form-select" required>
                <option value="">-- Alege cartea --</option>
                {% for carte in carti %}
                    <option value="{{ carte.id }}">{{ carte.titlu }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 mb-3">
            <label class="form-label fw-bold">Număr *</label>
            <input type="number" name="numar_capitol" class="form-control" min="1" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Stare</label>
            <select name="stare" class="form-select">
                <option value="ciorna">Ciornă</option>
                <option value="publicat">Publicat</option>
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Titlu Capitol *</label>
        <input type="text" name="titlu" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Conținut *</label>
        <textarea name="continut" class="form-control" rows="10" required placeholder="Scrie textul capitolului aici..."></textarea>
    </div>
    <div class="row bg-light p-3 border rounded mb-4 mx-0">
        <div class="col-md-6 form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault" name="este_gratuit">
            <label class="form-check-label fw-bold" for="flexSwitchCheckDefault">Acest capitol este GRATUIT</label>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold">Cost (Puncte)</label>
            <input type="number" name="cost_puncte" class="form-control" value="0" min="0">
            <small class="text-muted">Ignorat dacă capitolul este gratuit.</small>
        </div>
    </div>
    <div>
        <button type="submit" class="btn btn-success">Salvează Capitol</button>
        <a href="/capitole" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
