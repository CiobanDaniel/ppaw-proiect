<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare administrator · Creator Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="card shadow-sm border-0 mx-auto" style="max-width: 430px; width: calc(100% - 2rem);">
        <div class="card-body p-4 p-md-5">
            <p class="text-uppercase text-secondary small fw-semibold mb-2">Creator Hub</p>
            <h1 class="h3 mb-2">Administrare</h1>
            <p class="text-muted mb-4">Autentifică-te cu un cont care are rolul de administrator.</p>
            {% if request.query_params.get('error') %}
                <div class="alert alert-danger" role="alert">{{ request.query_params.get('error') }}</div>
            {% endif %}
            <form method="post" action="/admin/login">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="identificator">Nume utilizator sau email</label>
                    <input class="form-control" id="identificator" name="identificator" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="parola">Parolă</label>
                    <input class="form-control" id="parola" name="parola" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-dark w-100" type="submit">Intră în administrare</button>
            </form>
            <a class="btn btn-link w-100 mt-2" href="/">Înapoi la platformă</a>
        </div>
    </main>
</body>
</html>
