{% extends "base.html" %}
{% block title %}Creare Abonament{% endblock %}
{% block content %}
<h2 class="text-success mb-4">Pachet Abonament Nou</h2>
<form action="/abonamente/creare" method="POST" class="card shadow-sm p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Pachet *</label>
        <input type="text" name="nume" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Preț Real (RON) *</label>
        <input type="number" step="0.01" name="pret_real" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Descriere Beneficii</label>
        <textarea name="descriere_beneficii" class="form-control" rows="3"></textarea>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-success">Salvează Nivelul</button>
        <a href="/abonamente" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
