{% extends "base.html" %}
{% block title %}Creare Eveniment{% endblock %}
{% block content %}
<h2 class="text-primary mb-4">Eveniment Promoțional Nou</h2>
<form action="/evenimente/creare" method="POST" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Eveniment *</label>
        <input type="text" name="nume" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Recompensă (Puncte)*</label>
        <input type="number" name="recompensa_puncte" class="form-control" min="0" required>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label fw-bold">Data Începerii *</label>
            <input type="datetime-local" name="data_inceput" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold">Data Sfârșitului *</label>
            <input type="datetime-local" name="data_sfarsit" class="form-control" required>
        </div>
    </div>
    <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" id="activCheck" name="este_activ" checked>
        <label class="form-check-label fw-bold" for="activCheck">Activează imediat</label>
    </div>
    <div>
        <button type="submit" class="btn btn-primary">Salvează Evenimentul</button>
        <a href="/evenimente" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
