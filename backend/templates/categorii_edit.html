{% extends "base.html" %}
{% block title %}Editare Categorie{% endblock %}
{% block content %}
<h2 class="text-primary mb-4">Editare Categorie</h2>
<form action="/categorii/editare/{{ categorie.id }}" method="POST" class="card shadow-sm p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Categorie *</label>
        <input type="text" name="nume" class="form-control" value="{{ categorie.nume }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Descriere</label>
        <textarea name="descriere" class="form-control" rows="3">{{ categorie.descriere if categorie.descriere else '' }}</textarea>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Actualizează</button>
        <a href="/categorii" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
