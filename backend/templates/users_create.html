{% extends "base.html" %}

{% block title %}Creare Utilizator{% endblock %}

{% block content %}
<h2 class="mb-4">Adaugă Utilizator Nou</h2>
<form action="/utilizatori/creare" method="POST" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Utilizator *</label>
        <input type="text" name="nume_utilizator" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Email *</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Parola Hash *</label>
        <input type="text" name="parola_hash" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Rol *</label>
        <select name="rol" class="form-select" required>
            <option value="cititor">Cititor</option>
            <option value="autor">Autor</option>
            <option value="admin">Admin</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Telefon</label>
        <input type="text" name="telefon" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Adresa</label>
        <input type="text" name="adresa" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Data Nașterii</label>
        <input type="date" name="data_nasterii" class="form-control">
    </div>
    
    <div class="mt-4">
        <button type="submit" class="btn btn-success">Salvează Utilizator</button>
        <a href="/utilizatori" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
