{% extends "base.html" %}

{% block title %}Creare Carte{% endblock %}

{% block content %}
<h2 class="mb-4">Adaugă Carte Nouă</h2>
<form action="/carti/creare" method="POST" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Titlu *</label>
        <input type="text" name="titlu" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Autor *</label>
        <select name="id_autor" class="form-select" required>
            <option value="">Selectează un autor...</option>
            {% for autor in autori %}
                <option value="{{ autor.id }}">{{ autor.nume_utilizator }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Descriere</label>
        <textarea name="descriere" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Stare</label>
        <input type="text" name="stare" class="form-control" value="publicat">
    </div>
    
    <div class="mt-4">
        <button type="submit" class="btn btn-success">Salvează Carte</button>
        <a href="/carti" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
