{% extends "base.html" %}

{% block title %}Editare Utilizator{% endblock %}

{% block content %}
<h2 class="mb-4">Editare Utilizator: {{ utilizator.nume_utilizator }}</h2>
<form action="/utilizatori/editare/{{ utilizator.id }}" method="POST" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label fw-bold">Nume Utilizator *</label>
        <input type="text" name="nume_utilizator" class="form-control" value="{{ utilizator.nume_utilizator }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Email *</label>
        <input type="email" name="email" class="form-control" value="{{ utilizator.email }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-bold">Rol *</label>
        <select name="rol" class="form-select" required>
            <option value="cititor" {% if utilizator.rol == 'cititor' %}selected{% endif %}>Cititor</option>
            <option value="autor" {% if utilizator.rol == 'autor' %}selected{% endif %}>Autor</option>
            <option value="admin" {% if utilizator.rol == 'admin' %}selected{% endif %}>Admin</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Telefon</label>
        <input type="text" name="telefon" class="form-control" value="{{ utilizator.telefon or '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Adresa</label>
        <input type="text" name="adresa" class="form-control" value="{{ utilizator.adresa or '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Data Nașterii</label>
        <input type="date" name="data_nasterii" class="form-control" value="{{ utilizator.data_nasterii or '' }}">
    </div>
    
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Actualizează</button>
        <a href="/utilizatori" class="btn btn-secondary ms-2">Anulează</a>
    </div>
</form>
{% endblock %}
